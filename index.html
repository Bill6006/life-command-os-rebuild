<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Life Command OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        color: #f4f6fa;
        background:
          radial-gradient(120% 68% at 50% -12%, rgba(255, 125, 77, 0.13), transparent 62%),
          linear-gradient(180deg, #14171f, #0f1218);
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.65;
        color: #aab3c4;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        font-weight: 600;
        color: #1a1207;
        text-decoration: none;
        background: #ff7d4d;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Life Command OS</h1>
      <p>
        Production is not released yet. It is promoted only through the release phase, so this
        address stays empty until then.
      </p>
      <a href="./preview/">Open the preview build</a>
    </main>
  </body>
</html>
